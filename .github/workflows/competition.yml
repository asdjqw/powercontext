name: competition

on:
  workflow_dispatch:
  push:
    branches: [ci-hybrid]

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r competition/requirements.txt
          pip install -e . --no-deps
      - name: Run hybrid acceptance
        env:
          PYTHONPATH: src:competition
          PYTHONUTF8: "1"
          TZ: UTC
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q -c competition/pytest.ini --confcutdir=competition competition/challenges/retrieval-02-hybrid-search/acceptance
      - name: Compare hybrid with dual-query baseline
        env:
          PYTHONPATH: src:competition
          PYTHONUTF8: "1"
          TZ: UTC
        run: |
          python competition/ci/hybrid_probe.py
      - name: Run all competition acceptance
        if: always()
        env:
          PYTHONPATH: src:competition
          PYTHONUTF8: "1"
          TZ: UTC
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q -c competition/pytest.ini --confcutdir=competition competition/challenges
